<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستقیم‌ساز لینک گوگل درایو</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; text-align: center; color: #38bdf8; font-size: 1.4rem; }
        p { font-size: 0.9rem; color: #94a3b8; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; margin-bottom: 12px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .result { margin-top: 20px; display: none; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .link-box { word-break: break-all; font-size: 0.85rem; color: #38bdf8; margin: 10px 0; padding: 8px; background: #1e293b; border-radius: 6px; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn-group button, .btn-group a { flex: 1; text-align: center; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 0.85rem; border: none; cursor: pointer; }
        .btn-copy { background: #334155; color: #fff; }
        .btn-dl { background: #10b981; color: #fff; display: inline-block; line-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ تبدیل لینک گوگل درایو</h2>
        <p>لینک اشتراک‌گذاری درایو را وارد کنید تا لینک مستقیم دریافت کنید.</p>
        <input type="text" id="driveUrl" placeholder="https://drive.google.com/file/d/.../view">
        <button onclick="convertLink()">تبدیل به لینک مستقیم</button>

        <div class="result" id="resultBox">
            <div style="font-size:0.85rem; color:#a7f3d0;">✅ لینک مستقیم ساخته شد:</div>
            <div class="link-box" id="directLink"></div>
            <div class="btn-group">
                <button class="btn-copy" onclick="copyLink()">📋 کپی لینک</button>
                <a class="btn-dl" id="downloadBtn" href="#" target="_blank">📥 دانلود</a>
            </div>
        </div>
    </div>

    <script>
        function extractId(url) {
            const patterns = [
                /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
                /drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([a-zA-Z0-9_-]+)/,
                /drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([a-zA-Z0-9_-]+)/
            ];
            for (let p of patterns) {
                let m = url.match(p);
                if (m) return m[1];
            }
            return null;
        }

        function convertLink() {
            const input = document.getElementById('driveUrl').value;
            const fileId = extractId(input);
            if (!fileId) {
                alert('لطفاً یک لینک معتبر از گوگل درایو وارد کنید.');
                return;
            }
            const directUrl = `https://drive.usercontent.google.com/download?id=${fileId}&export=download&confirm=t`;
            document.getElementById('directLink').innerText = directUrl;
            document.getElementById('downloadBtn').href = directUrl;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyLink() {
            const link = document.getElementById('directLink').innerText;
            navigator.clipboard.writeText(link);
            alert('لینک کپی شد!');
        }
    </script>
</body>
</html>
